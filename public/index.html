<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#fdfaf5" />
    <title>לוח הבית</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <header class="topbar">
        <div class="topbar__left">
          <span class="weather" id="weather">☀ 23° בהיר</span>
          <div class="kid-tabs" id="kidTabs" role="tablist"></div>
        </div>
        <div class="topbar__right">
          <div class="daypart" id="daypart">בוקר טוב</div>
          <div class="clock" id="clock">--:--</div>
          <div class="date" id="date">—</div>
          <div class="updated" id="updated">עודכן —</div>
        </div>
      </header>

      <section class="view" id="view"></section>

      <nav class="bottombar" id="bottombar" aria-label="ניווט"></nav>
    </main>

    <template id="kid-card-template">
      <article class="kidcard">
        <header class="kidcard__head">
          <span class="kidcard__badge">א</span>
          <div class="kidcard__title"></div>
          <div class="kidcard__sub"></div>
          <div class="kidcard__count"></div>
        </header>
        <div class="kidcard__body"></div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
